appId: io.github.akeyblademaster.multiremote-terminal
productName: MultiRemoteTerminal
directories:
  app: apps/desktop
  buildResources: apps/desktop/resources
  output: artifacts/windows
files:
  - "**/*"
  - "!src/**"
  - "!native/**"
  - "!resources/**"
  - "!tests/**"
  - "!**/*.map"
  - "!**/*.pdb"
extraResources:
  - from: apps/desktop/resources/credential-prompt.ps1
    to: credential-prompt.ps1
asar: true
afterPack: ./scripts/electron-fuses.mjs
asarUnpack:
  - "**/*.node"
  - "**/*.exe"
  - "**/*.dll"
npmRebuild: false
win:
  icon: apps/desktop/resources/multiremote-terminal.ico
  signtoolOptions:
    signingHashAlgorithms:
      - sha256
    rfc3161TimeStampServer: http://timestamp.digicert.com
  target:
    - target: nsis
      arch:
        - x64
    - target: portable
      arch:
        - x64
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
